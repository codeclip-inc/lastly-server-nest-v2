<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>점포 등록 및 조회 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
            padding: 30px;
            border: 2px solid #f0f0f0;
            border-radius: 15px;
            background: #fafafa;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8rem;
            border-bottom: 3px solid #4facfe;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            background: #f8f9fa;
            border-left: 4px solid #4facfe;
        }

        .result.success {
            background: #d4edda;
            border-left-color: #28a745;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border-left-color: #dc3545;
            color: #721c24;
        }

        .image-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .image-preview img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }

        .workspace-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .workspace-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .workspace-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .workspace-card h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .workspace-card p {
            color: #666;
            margin-bottom: 5px;
        }

        .workspace-images {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .workspace-images img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .token-info {
            background: #e3f2fd;
            border: 1px solid #2196f3;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .token-info h3 {
            color: #1976d2;
            margin-bottom: 10px;
        }

        .token-info p {
            color: #424242;
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏪 점포 등록 및 조회 시스템</h1>
            <p>Lastly Server API 테스트 페이지</p>
        </div>

        <div class="content">
            <!-- 인증 섹션 -->
            <div class="section">
                <h2>🔐 인증</h2>
                
                <div id="auth-section">
                    <div class="form-group">
                        <label for="phoneNumber">휴대폰 번호</label>
                        <input type="tel" id="phoneNumber" placeholder="010-1234-5678" value="010-1234-5678">
                    </div>
                    
                    <button class="btn" onclick="requestCode()">인증 코드 요청</button>
                    
                    <div class="form-group">
                        <label for="verifyCode">인증 코드</label>
                        <input type="text" id="verifyCode" placeholder="6자리 인증 코드">
                    </div>
                    
                    <button class="btn btn-secondary" onclick="login()">로그인</button>
                    <button class="btn btn-success" onclick="signup()">회원가입</button>
                </div>

                <div id="token-info" class="token-info hidden">
                    <h3>인증 토큰</h3>
                    <p id="token-display"></p>
                    <button class="btn btn-danger" onclick="logout()">로그아웃</button>
                </div>
            </div>

            <!-- 이미지 업로드 섹션 -->
            <div class="section">
                <h2>📸 이미지 업로드</h2>
                
                <div class="form-group">
                    <label for="imageFile">이미지 파일 선택</label>
                    <input type="file" id="imageFile" accept="image/*" multiple>
                </div>
                
                <button class="btn" onclick="uploadImages()">이미지 업로드</button>
                
                <div id="uploaded-images" class="image-preview"></div>
            </div>

            <!-- 점포 등록 섹션 -->
            <div class="section">
                <h2>🏪 점포 등록</h2>
                
                <div class="form-group">
                    <label for="workspaceName">점포 이름</label>
                    <input type="text" id="workspaceName" placeholder="예: 파리바게트 강남점">
                </div>
                
                <div class="form-group">
                    <label for="ownerName">점포 주인 이름</label>
                    <input type="text" id="ownerName" placeholder="예: 강남점 점장">
                </div>
                
                <div class="form-group">
                    <label for="categoryId">카테고리 ID</label>
                    <input type="text" id="categoryId" placeholder="1" value="1">
                </div>
                
                <div class="form-group">
                    <label for="address">주소</label>
                    <input type="text" id="address" placeholder="서울시 강남구 강남대로 123">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="latitude">위도</label>
                        <input type="number" id="latitude" step="any" placeholder="37.48509" value="37.48509">
                    </div>
                    <div class="form-group">
                        <label for="longitude">경도</label>
                        <input type="number" id="longitude" step="any" placeholder="126.8646" value="126.8646">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="businessRegistrationNum">사업자 등록번호</label>
                    <input type="text" id="businessRegistrationNum" placeholder="123456789012">
                </div>
                
                <button class="btn" onclick="createWorkspace()">점포 등록</button>
            </div>

            <!-- 점포 조회 섹션 -->
            <div class="section">
                <h2>🔍 점포 조회</h2>
                
                <div class="form-group">
                    <label for="workspaceId">점포 ID</label>
                    <input type="text" id="workspaceId" placeholder="점포 ID를 입력하세요">
                </div>
                
                <button class="btn" onclick="getWorkspace()">점포 조회</button>
                
                <div id="workspace-result" class="result hidden"></div>
            </div>

            <!-- 로딩 인디케이터 -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>처리 중...</p>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:3000';
        let accessToken = localStorage.getItem('accessToken');
        let refreshToken = localStorage.getItem('refreshToken');
        let uploadedImageIds = [];

        // 페이지 로드 시 토큰 확인
        window.onload = function() {
            if (accessToken) {
                showTokenInfo();
            }
        };

        // 인증 코드 요청
        async function requestCode() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            if (!phoneNumber) {
                alert('휴대폰 번호를 입력해주세요.');
                return;
            }

            try {
                showLoading();
                const response = await fetch(`${BASE_URL}/auth/request-code`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ phoneNumber })
                });

                const result = await response.json();
                hideLoading();

                if (response.ok) {
                    showResult('인증 코드가 전송되었습니다.', 'success');
                } else {
                    showResult(`오류: ${result.message || '인증 코드 전송 실패'}`, 'error');
                }
            } catch (error) {
                hideLoading();
                showResult(`오류: ${error.message}`, 'error');
            }
        }

        // 로그인
        async function login() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            const code = document.getElementById('verifyCode').value;

            if (!phoneNumber || !code) {
                alert('휴대폰 번호와 인증 코드를 입력해주세요.');
                return;
            }

            try {
                showLoading();
                const response = await fetch(`${BASE_URL}/auth/phone/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ phoneNumber, code })
                });

                const result = await response.json();
                hideLoading();

                if (response.ok) {
                    accessToken = result.accessToken;
                    refreshToken = result.refreshToken;
                    localStorage.setItem('accessToken', accessToken);
                    localStorage.setItem('refreshToken', refreshToken);
                    showTokenInfo();
                    showResult('로그인 성공!', 'success');
                } else {
                    showResult(`로그인 실패: ${result.message || '인증 코드가 올바르지 않습니다.'}`, 'error');
                }
            } catch (error) {
                hideLoading();
                showResult(`오류: ${error.message}`, 'error');
            }
        }

        // 회원가입
        async function signup() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            const code = document.getElementById('verifyCode').value;
            const name = prompt('이름을 입력해주세요:');

            if (!phoneNumber || !code || !name) {
                alert('모든 정보를 입력해주세요.');
                return;
            }

            try {
                showLoading();
                const response = await fetch(`${BASE_URL}/auth/phone/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ phoneNumber, code, name })
                });

                const result = await response.json();
                hideLoading();

                if (response.ok) {
                    accessToken = result.accessToken;
                    refreshToken = result.refreshToken;
                    localStorage.setItem('accessToken', accessToken);
                    localStorage.setItem('refreshToken', refreshToken);
                    showTokenInfo();
                    showResult('회원가입 및 로그인 성공!', 'success');
                } else {
                    showResult(`회원가입 실패: ${result.message || '오류가 발생했습니다.'}`, 'error');
                }
            } catch (error) {
                hideLoading();
                showResult(`오류: ${error.message}`, 'error');
            }
        }

        // 로그아웃
        function logout() {
            accessToken = null;
            refreshToken = null;
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('token-info').classList.add('hidden');
            showResult('로그아웃되었습니다.', 'success');
        }

        // 토큰 정보 표시
        function showTokenInfo() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('token-info').classList.remove('hidden');
            document.getElementById('token-display').textContent = accessToken;
        }

        // 이미지 업로드
        async function uploadImages() {
            if (!accessToken) {
                alert('먼저 로그인해주세요.');
                return;
            }

            const fileInput = document.getElementById('imageFile');
            const files = fileInput.files;

            if (files.length === 0) {
                alert('이미지 파일을 선택해주세요.');
                return;
            }

            uploadedImageIds = [];
            const imagePreview = document.getElementById('uploaded-images');
            imagePreview.innerHTML = '';

            for (let file of files) {
                try {
                    showLoading();
                    
                    // 1. 업로드 경로 요청
                    const uploadRequest = await fetch(`${BASE_URL}/s3/upload/request`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${accessToken}`
                        },
                        body: JSON.stringify({
                            byteSize: file.size,
                            format: file.type,
                            originalName: file.name
                        })
                    });

                    const uploadData = await uploadRequest.json();
                    
                    if (!uploadRequest.ok) {
                        throw new Error(uploadData.message || '업로드 경로 요청 실패');
                    }

                    // 2. S3에 파일 업로드
                    const formData = new FormData();
                    Object.keys(uploadData.fields).forEach(key => {
                        formData.append(key, uploadData.fields[key]);
                    });
                    formData.append('file', file);

                    const uploadResponse = await fetch(uploadData.url, {
                        method: 'POST',
                        body: formData
                    });

                    if (uploadResponse.ok) {
                        uploadedImageIds.push(uploadData.id.toString());
                        
                        // 이미지 미리보기 추가
                        const img = document.createElement('img');
                        img.src = URL.createObjectURL(file);
                        img.alt = file.name;
                        imagePreview.appendChild(img);
                    } else {
                        throw new Error('S3 업로드 실패');
                    }
                } catch (error) {
                    hideLoading();
                    showResult(`이미지 업로드 실패: ${error.message}`, 'error');
                    return;
                }
            }

            hideLoading();
            showResult(`${uploadedImageIds.length}개 이미지 업로드 완료!`, 'success');
        }

        // 점포 등록
        async function createWorkspace() {
            if (!accessToken) {
                alert('먼저 로그인해주세요.');
                return;
            }

            const workspaceData = {
                name: document.getElementById('workspaceName').value,
                ownerName: document.getElementById('ownerName').value,
                categoryId: document.getElementById('categoryId').value,
                address: document.getElementById('address').value,
                latitude: parseFloat(document.getElementById('latitude').value),
                longitude: parseFloat(document.getElementById('longitude').value),
                businessRegistrationNum: document.getElementById('businessRegistrationNum').value,
                imageIds: uploadedImageIds
            };

            // 필수 필드 검증
            if (!workspaceData.name || !workspaceData.ownerName || !workspaceData.categoryId || !workspaceData.address || 
                !workspaceData.latitude || !workspaceData.longitude || !workspaceData.businessRegistrationNum) {
                alert('모든 필수 정보를 입력해주세요.');
                return;
            }

            try {
                showLoading();
                const response = await fetch(`${BASE_URL}/workspaces`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify(workspaceData)
                });

                hideLoading();

                if (response.ok) {
                    showResult('점포 등록 성공!', 'success');
                    // 폼 초기화
                    document.getElementById('workspaceName').value = '';
                    document.getElementById('ownerName').value = '';
                    document.getElementById('address').value = '';
                    document.getElementById('businessRegistrationNum').value = '';
                    uploadedImageIds = [];
                    document.getElementById('uploaded-images').innerHTML = '';
                } else {
                    const errorData = await response.json();
                    showResult(`점포 등록 실패: ${errorData.message || '오류가 발생했습니다.'}`, 'error');
                }
            } catch (error) {
                hideLoading();
                showResult(`오류: ${error.message}`, 'error');
            }
        }

        // 점포 조회
        async function getWorkspace() {
            const workspaceId = document.getElementById('workspaceId').value;
            if (!workspaceId) {
                alert('점포 ID를 입력해주세요.');
                return;
            }

            try {
                showLoading();
                const response = await fetch(`${BASE_URL}/workspaces/${workspaceId}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();
                hideLoading();

                if (response.ok) {
                    console.log('서버 응답:', result); // 디버깅용
                    displayWorkspace(result);
                } else {
                    showResult(`점포 조회 실패: ${result.message || '점포를 찾을 수 없습니다.'}`, 'error');
                }
            } catch (error) {
                hideLoading();
                showResult(`오류: ${error.message}`, 'error');
            }
        }

        // 점포 정보 표시
        function displayWorkspace(workspace) {
            const resultDiv = document.getElementById('workspace-result');
            
            // 안전하게 데이터 접근
            const categoryName = workspace.category ? workspace.category.name : '카테고리 정보 없음';
            const ownerName = workspace.ownerName || (workspace.ownerUser ? workspace.ownerUser.name : '소유자 정보 없음');
            const images = workspace.images || [];
            
            resultDiv.innerHTML = `
                <h3>${workspace.name || '이름 없음'}</h3>
                <p><strong>ID:</strong> ${workspace.id}</p>
                <p><strong>주소:</strong> ${workspace.address || '주소 없음'}</p>
                <p><strong>위도:</strong> ${workspace.latitude || '위도 없음'}</p>
                <p><strong>경도:</strong> ${workspace.longitude || '경도 없음'}</p>
                <p><strong>사업자 등록번호:</strong> ${workspace.businessRegistrationNum || '사업자 등록번호 없음'}</p>
                <p><strong>카테고리:</strong> ${categoryName}</p>
                <p><strong>점포 주인:</strong> ${ownerName}</p>
                <div class="workspace-images">
                    ${images.map(img => `<img src="${img.key || img.path}" alt="${img.originalName}">`).join('')}
                </div>
            `;
            resultDiv.classList.remove('hidden');
            resultDiv.className = 'result success';
        }

        // 결과 표시
        function showResult(message, type = 'success') {
            const resultDiv = document.getElementById('workspace-result');
            resultDiv.innerHTML = `<p>${message}</p>`;
            resultDiv.classList.remove('hidden');
            resultDiv.className = `result ${type}`;
        }

        // 로딩 표시
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }

        // 로딩 숨기기
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
    </script>
</body>
</html>
